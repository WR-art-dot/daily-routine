<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>工作生活</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div id="boot-warn" hidden>
  <div class="boot-warn-box">
    <h1>需要从本地服务器打开</h1>
    <p>双击打开 HTML 文件时，浏览器不开放本地数据库，数据将无法保存。</p>
    <p>请关掉这个页面，双击项目根目录的 <code>start.cmd</code>，然后访问 <code>http://127.0.0.1:8787/</code>。</p>
  </div>
</div>

<div id="app">
  <nav class="rail" id="rail" aria-label="主导航"></nav>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-main">
        <span class="topbar-title" id="page-title">首页</span>
        <span class="topbar-meta" id="page-meta"></span>
      </div>
      <div class="topbar-side">
        <button class="btn sm" id="btn-save" type="button" title="立即保存所有未写入的改动（Ctrl+S）">保存</button>
        <button class="icon-btn" id="btn-search" type="button" aria-label="全局搜索">
          <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
        </button>
        <span class="save-dot" id="save-dot" data-state="idle" title="已保存"></span>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>
<div id="overlay-host"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.4 12 5l8 6.4V20h-5.4v-5.2H9.4V20H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.8" y="5.4" width="16.4" height="14" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 10h16.4M8.6 3.4v3.6M15.4 3.4v3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-media" viewBox="0 0 24 24"><rect x="3.8" y="5" width="16.4" height="14" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 9.4v5.2l4.6-2.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-dev" viewBox="0 0 24 24"><path d="M9.2 8 5.2 12l4 4M14.8 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-study" viewBox="0 0 24 24"><path d="M5.4 5.6A1.6 1.6 0 0 1 7 4h11.6v16H7a1.6 1.6 0 0 0-1.6 1.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5.4 17.6h13.2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-fitness" viewBox="0 0 24 24"><path d="M6.6 9.2v5.6M4 10.4v3.2M17.4 9.2v5.6M20 10.4v3.2M6.6 12h10.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-food" viewBox="0 0 24 24"><path d="M4.6 11h14.8a7.4 7.4 0 0 1-14.8 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8.2V4.4M9.4 8.2V5.6M14.6 8.2V5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><rect x="3.4" y="7.2" width="17.2" height="9.6" rx="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.4v3.2M6.4 12h3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.6" cy="11" r="1" fill="currentColor"/><circle cx="17.6" cy="13" r="1" fill="currentColor"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h8M16 7h4M4 12h3M11 12h9M4 17h10M18 17h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="7" r="1.9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="12" r="1.9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="17" r="1.9" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.6 15.6 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.4v13.2M5.4 12h13.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M9 5.5 15.5 12 9 18.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<script>
  if (location.protocol === 'file:') {
    document.getElementById('boot-warn').hidden = false;
    document.getElementById('app').hidden = true;
  }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
